name: Content watch

# Detects when a corpus repo has a newer tag than the pinned submodule and opens one
# draft PR per drifted submodule, with the catalog diff in the body.
#
# Replaces the manual loop: check tags -> bump pointer -> rebuild catalog -> read the
# diff -> open PR. What it deliberately does NOT do is merge, or decide whether a
# content_hash change is cosmetic or substantive. Both stay human.
#
# REQUIRES a PAT at secrets.CONTENT_WATCH_TOKEN with Contents and Pull requests
# read/write. GITHUB_TOKEN cannot be used: PRs it opens do not trigger other
# workflows, so the CI gates would never run on the promotion PR, which is the one
# thing the PR exists for.

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      submodule:
        description: 'One of nextjs | react | angular | nestjs. Blank checks all four.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        submodule: [nextjs, react, angular, nestjs]

    steps:
      - name: Skip unselected submodules
        id: gate
        env:
          WANT: ${{ github.event.inputs.submodule }}
          THIS: ${{ matrix.submodule }}
        run: |
          if [ -n "$WANT" ] && [ "$WANT" != "$THIS" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip == 'false'
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.CONTENT_WATCH_TOKEN }}

      - name: Compare pinned tag against latest
        if: steps.gate.outputs.skip == 'false'
        id: compare
        env:
          SM: content/${{ matrix.submodule }}
        run: |
          set -euo pipefail
          git -C "$SM" fetch --tags --quiet

          PINNED=$(git -C "$SM" describe --tags --exact-match HEAD 2>/dev/null || echo '')
          if [ -z "$PINNED" ]; then
            echo "::warning::$SM is not on a tag; verify-submodules should already be failing"
            echo "drift=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Highest semver, not most recently created: a backport tagged today must
          # not look newer than the release it was cut from.
          LATEST=$(git -C "$SM" tag -l 'v*' | sort -V | tail -n1)

          echo "pinned=$PINNED" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

          if [ "$PINNED" = "$LATEST" ]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HIGHER=$(printf '%s\n%s\n' "$PINNED" "$LATEST" | sort -V | tail -n1)
          if [ "$HIGHER" = "$LATEST" ]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::$SM pinned at $PINNED which is ahead of latest tag $LATEST"
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if a PR for this bump already exists
        if: steps.compare.outputs.drift == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ secrets.CONTENT_WATCH_TOKEN }}
          BRANCH: content/${{ matrix.submodule }}-${{ steps.compare.outputs.latest }}
        run: |
          set -euo pipefail
          COUNT=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -gt 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.compare.outputs.drift == 'true' && steps.existing.outputs.exists == 'false'
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        if: steps.compare.outputs.drift == 'true' && steps.existing.outputs.exists == 'false'
        with:
          node-version: 22
          cache: pnpm

      - name: Bump the pin and diff the catalog
        id: bump
        if: steps.compare.outputs.drift == 'true' && steps.existing.outputs.exists == 'false'
        env:
          SM: content/${{ matrix.submodule }}
          PINNED: ${{ steps.compare.outputs.pinned }}
          LATEST: ${{ steps.compare.outputs.latest }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

          # `|| true` on the catalog build: a remaining fatal (zero articles,
          # a path pointing at a missing article) must not abort the bump.
          # Unresolved refs no longer refuse the write — they travel in the
          # artifact and `verify-links` is the gate that fails on them.
          # Do not substitute `{}` for a missing catalog.json: catalog-diff
          # distinguishes a missing snapshot from an empty one, and `{}` is
          # how a real add/remove used to look like a no-op.
          pnpm build:catalog || true
          if [ -f catalog.json ]; then
            cp catalog.json /tmp/before.json
          fi

          BEFORE_SHA=$(git -C "$SM" rev-parse HEAD)
          git -C "$SM" checkout --quiet "$LATEST"
          AFTER_SHA=$(git -C "$SM" rev-parse HEAD)

          # Two tags can point at the same commit — a re-tag, or a release cut with
          # no new commits. The tag moved but the gitlink did not, so there is nothing
          # for the parent to record and `git commit` would exit 1 under `set -e`.
          if [ "$BEFORE_SHA" = "$AFTER_SHA" ]; then
            echo "::notice::$LATEST points at the same commit as $PINNED; no gitlink change"
            echo "same_commit=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "same_commit=false" >> "$GITHUB_OUTPUT"

          pnpm build:catalog || true
          if [ -f catalog.json ]; then
            cp catalog.json /tmp/after.json
          fi

          node scripts/catalog-diff.mjs /tmp/before.json /tmp/after.json "$PINNED" "$LATEST" /tmp/body.md

      - name: Open the draft PR
        if: >-
          steps.compare.outputs.drift == 'true' &&
          steps.existing.outputs.exists == 'false' &&
          steps.bump.outputs.same_commit == 'false'
        env:
          GH_TOKEN: ${{ secrets.CONTENT_WATCH_TOKEN }}
          SM: content/${{ matrix.submodule }}
          BRANCH: ${{ steps.existing.outputs.branch }}
          TITLE: 'content(${{ matrix.submodule }}): promote submodule to ${{ steps.compare.outputs.latest }}'
        run: |
          set -euo pipefail
          git config user.name  'content-watch'
          git config user.email 'content-watch@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add "$SM"

          if git diff --cached --quiet; then
            echo "::error::nothing staged for $SM — the gitlink did not change"
            exit 1
          fi

          {
            printf '%s\n\n' "$TITLE"
            printf '%s\n' 'Detected by the content-watch workflow. Catalog diff is in the PR body.'
            printf '%s\n' 'Not reviewed: the cosmetic-vs-substantive call on any content_hash change is human.'
          } > /tmp/commit-msg.txt

          git commit -F /tmp/commit-msg.txt
          git push origin "$BRANCH"

          gh pr create --draft \
            --title "$TITLE" \
            --body-file /tmp/body.md \
            --base main \
            --head "$BRANCH"
